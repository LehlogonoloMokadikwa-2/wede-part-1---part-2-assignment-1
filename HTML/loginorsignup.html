<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login / Signup</title>
    <style>
        :root{
            --bg:#f3f6fb; --card:#ffffff; --accent:#2463eb; --muted:#6b7280;
        }
        *{box-sizing:border-box;font-family:Inter,Segoe UI,system-ui,Arial,sans-serif}
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#eef4ff, #f3f6fb);}
        .container{width:960px;max-width:96%;display:grid;grid-template-columns:1fr 420px;gap:28px;align-items:center}
        .promo{padding:36px;border-radius:12px;background:linear-gradient(135deg,#ffffff66, #ffffff33);box-shadow:0 6px 20px rgba(16,24,40,0.06);min-height:420px}
        .promo h1{margin:0 0 12px;font-size:26px;color:#0f172a}
        .promo p{margin:0;color:var(--muted)}
        .card{background:var(--card);padding:22px;border-radius:12px;box-shadow:0 8px 30px rgba(15,23,42,0.06)}
        .tabs{display:flex;gap:8px;margin-bottom:14px}
        .tab{flex:1;padding:10px;border-radius:8px;text-align:center;cursor:pointer;color:var(--muted);font-weight:600}
        .tab.active{background:linear-gradient(90deg,var(--accent),#4b8bff);color:#fff}
        form{display:grid;gap:12px}
        label{font-size:13px;color:var(--muted)}
        input[type="text"], input[type="email"], input[type="password"], input[type="tel"], input[type="number"]{
            width:100%;padding:10px;border:1px solid #e6edf9;border-radius:8px;font-size:14px
        }
        .row{display:flex;gap:8px}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:8px;border:0;cursor:pointer;font-weight:600}
        .btn.primary{background:var(--accent);color:#fff}
        .btn.ghost{background:#f6f8ff;color:var(--accent);border:1px solid #e6edff}
        .socials{display:flex;gap:8px}
        .social-btn{flex:1;padding:10px;border-radius:8px;border:1px solid #e6edf9;background:#fff;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:center}
        .muted{color:var(--muted);font-size:13px}
        .small{font-size:12px;color:var(--muted)}
        .otp-box{display:flex;gap:6px}
        .otp-box input{width:44px;text-align:center;font-weight:700;font-size:18px}
        .divider{height:1px;background:#eef2ff;margin:8px 0;border-radius:1px}
        .note{font-size:12px;color:var(--muted)}
        @media (max-width:820px){
            .container{grid-template-columns:1fr;align-items:stretch}
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="promo">
            <h1>Welcome back</h1>
            <p>Sign in or create an account quickly using email, phone, or your social accounts.</p>
            <div>
                <img src="Images/login-illustration.png" alt="Illustration of a person logging in on a laptop" style="width:100%;margin-top:20px;border-radius:8px;">
                
            </div>
